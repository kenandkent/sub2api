root = "."
tmp_dir = "../.cache/dev/air"
env_files = []

[build]
cmd = "go build -trimpath -o ../.cache/dev/bin/server ./cmd/server"
entrypoint = ["python3", "-B", "../deploy/dev.py", "backend-exec"]
include_ext = ["go", "sql", "yaml", "yml", "json", "mod", "sum"]
include_file = ["go.mod", "go.sum", "cmd/server/VERSION"]
exclude_dir = ["bin", "data", "tmp", ".gocache", "internal/web/dist"]
exclude_regex = ["_test\\.go$"]
exclude_unchanged = true
delay = 500
stop_on_error = false
send_interrupt = true
kill_delay = "6s"
log = "build-errors.log"

[log]
time = true
main_only = false

[misc]
clean_on_exit = false

[screen]
clear_on_rebuild = false
keep_scroll = true
