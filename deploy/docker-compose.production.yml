# Requires Docker Compose >= 2.24.4 for !reset.
# Merge after docker-compose.local.yml with --project-directory set to the
# deployment root so persistent bind mounts stay outside releases/<sha>.
services:
  sub2api:
    image: ${SUB2API_IMAGE:?SUB2API_IMAGE is required}
    pull_policy: missing
    build: !reset null
  # Verified against the running production RepoDigests on 2026-10-31.
  # Dependency upgrades require an explicit compatibility/backup review.
  postgres:
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
  redis:
    image: redis:8.10.3-alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537
