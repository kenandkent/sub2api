# Opt-in only: use with docker-compose.yml and a private .dev/opencode-free.env.
services:
  sub2api:
    env_file:
      - ../.dev/opencode-free.env
    environment:
      - OPENCODE_FREE_BUN_WORKER_ENDPOINT=http://127.0.0.1:19090

  opencode-free-worker:
    build:
      context: ..
      dockerfile: deploy/opencode/worker/Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    network_mode: service:sub2api
    depends_on:
      sub2api:
        condition: service_started
    env_file:
      - ../.dev/opencode-free.env
    environment:
      - LISTEN_HOST=127.0.0.1
      - PORT=19090
      - BUN_RUNTIME_TRANSPILER_CACHE_PATH=0
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:19090/health/ready').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
